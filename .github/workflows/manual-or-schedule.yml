# Runs the tests in two ways. Pushes to main do not run it.
#
#   1. Every hour, on a schedule: tests SIT, to catch it breaking between deploys.
#   2. By hand: Actions tab -> "Run tests (manual or schedule)" -> Run workflow.
#
#   target = sit   (default) test the app that is already deployed on SIT.
#                  Use it to re-run the SIT tests without deploying again.
#   target = local build the app from this branch, serve it on the runner,
#                  and test that. Use it to try a change before tagging sit_*.
name: Run tests (manual or schedule)

on:
  schedule:
    # Cron in UTC: minute 17 of every hour. GitHub is busiest at minute 0,
    # so runs scheduled then are more often delayed or dropped.
    # Scheduled runs use the workflow file on the default branch (main).
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Where to run the tests
        type: choice
        options: [sit, local]
        default: sit
      expected_version:
        description: "SIT only: the version SIT should serve, e.g. sit_1.0.1. Leave empty to accept any sit_* version."
        type: string
        required: false

permissions:
  contents: read
  pages: read # to look up the SIT URL from the repo's Pages settings

jobs:
  test:
    # Scheduled runs have no inputs, so inputs.target is empty. Fall back to sit.
    name: Test ${{ inputs.target || 'sit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET: ${{ inputs.target || 'sit' }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Ask GitHub where Pages serves the site. This follows a custom domain,
      # so nothing is hard-coded. Setting SIT_URL makes playwright.config.ts
      # test that URL instead of starting a local server.
      - name: Look up the SIT URL
        if: ${{ env.TARGET == 'sit' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url)
          echo "SIT URL: ${url}"
          echo "SIT_URL=${url}" >> "$GITHUB_ENV"

      - name: Run Playwright tests
        env:
          EXPECTED_VERSION: ${{ env.TARGET == 'sit' && inputs.expected_version || '' }}
        run: npx playwright test

      # Upload the HTML report even when tests fail, so you can see what broke.
      - name: Upload HTML report
        id: upload-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ env.TARGET }}
          path: playwright-report/
          retention-days: 14

      # GitHub can't display the HTML report itself, so put a download link
      # under the results table on the run's Summary page.
      - name: Link the HTML report on the Summary page
        if: ${{ !cancelled() && steps.upload-report.outputs.artifact-url != '' }}
        env:
          REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        run: |
          {
            echo "### Full HTML report"
            echo ""
            echo "[Download the HTML report](${REPORT_URL}) (screenshots and traces), unzip it, then run:"
            echo ""
            echo '```bash'
            echo 'npx playwright show-report path/to/the/unzipped/folder'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
