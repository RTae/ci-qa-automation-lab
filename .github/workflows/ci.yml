# CI: runs on every push / PR to main, before anything is deployed.
# Builds the app, serves it on the runner (localhost) and runs the tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Adds a "Run workflow" button in the Actions tab so you can run it by hand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and starts the app itself (webServer),
      # because SIT_URL is not set here.
      - name: Run Playwright tests
        run: npx playwright test

      # Upload the HTML report even when tests fail, so you can see what broke.
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
