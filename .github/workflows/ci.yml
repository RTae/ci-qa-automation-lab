# CI: runs only when you start it by hand (Actions tab -> CI -> Run workflow).
# Builds the app, serves it on the runner (localhost) and runs the tests.
# Pushes to main do NOT trigger it. Deploys and SIT tests run from sit.yml on sit_* tags.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and starts the app itself (webServer),
      # because SIT_URL is not set here.
      - name: Run Playwright tests
        run: npx playwright test

      # Upload the HTML report even when tests fail, so you can see what broke.
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
